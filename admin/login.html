<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REDEX Admin | Login</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="brand">
      <img src="../logo-redex-blanco.png" alt="REDEX Inmobiliaria">
    </div>
    <div class="eyebrow">Panel Administrativo</div>
    <h1>Acceso privado</h1>
    <p class="muted">Ingresa con el usuario autorizado de Supabase para administrar propiedades.</p>

    <form class="admin-form" id="login-form">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary-btn" type="submit">Entrar al panel</button>
    </form>

    <div class="admin-status" id="login-status" aria-live="polite"></div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
